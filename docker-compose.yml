services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud}
      POSTGRES_DB: ${POSTGRES_DB:-private_cloud}
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloud}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cloud}
    ports:
      - "${RABBITMQ_EXPOSE_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_EXPOSE_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  main-api:
    build:
      context: ./main-api
    environment:
      APP_NAME: main-api
      POSTGRES_USER: ${POSTGRES_USER:-cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud}
      POSTGRES_DB: ${POSTGRES_DB:-private_cloud}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      RABBITMQ_USER: ${RABBITMQ_USER:-cloud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cloud}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      HOST_NODE: ${HOST_NODE:-localhost}
      TOTAL_CPU: ${TOTAL_CPU:-32}
      TOTAL_MEMORY_MIB: ${TOTAL_MEMORY_MIB:-131072}
      TOTAL_DISK_GIB: ${TOTAL_DISK_GIB:-2000}
      VM_COMMAND_TIMEOUT_SECONDS: 120
    ports:
      - "${MAIN_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  vm-manager:
    build:
      context: ./vm-manager
    privileged: true
    network_mode: host
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cloud}:${RABBITMQ_PASSWORD:-cloud}@localhost:${RABBITMQ_EXPOSE_PORT:-5672}/
      VM_MANAGER_CONCURRENCY: ${VM_MANAGER_CONCURRENCY:-4}
      BASE_IMAGE_URL: ${BASE_IMAGE_URL:-https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img}
      VM_BASE_DIR: ${VM_BASE_DIR:-/var/lib/vm-manager}
      VM_COMMAND_TIMEOUT_SECONDS: 120
    volumes:
      - vmdata:${VM_BASE_DIR:-/var/lib/vm-manager}
      - /var/run:/var/run
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  vmdata:
