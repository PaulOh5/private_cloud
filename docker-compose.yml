services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud}
      POSTGRES_DB: ${POSTGRES_DB:-private_cloud}
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloud}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cloud}
    ports:
      - "${RABBITMQ_EXPOSE_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_EXPOSE_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  main-api:
    build:
      context: ./main-api
    restart: unless-stopped
    environment:
      APP_NAME: main-api
      POSTGRES_USER: ${POSTGRES_USER:-cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud}
      POSTGRES_DB: ${POSTGRES_DB:-private_cloud}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      RABBITMQ_USER: ${RABBITMQ_USER:-cloud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cloud}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      HOST_NODE: ${HOST_NODE:-localhost}
      TOTAL_CPU: ${TOTAL_CPU:-32}
      TOTAL_MEMORY_MIB: ${TOTAL_MEMORY_MIB:-131072}
      TOTAL_DISK_GIB: ${TOTAL_DISK_GIB:-2000}
      VM_COMMAND_TIMEOUT_SECONDS: 120
      TASK_STALE_QUEUED_TIMEOUT_SECONDS: ${TASK_STALE_QUEUED_TIMEOUT_SECONDS:-180}
      TASK_STALE_SWEEP_INTERVAL_SECONDS: ${TASK_STALE_SWEEP_INTERVAL_SECONDS:-15}
      BASE_IMAGE_URL: ${BASE_IMAGE_URL:-https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img}
      VM_IMAGE_CATALOG_JSON: ${VM_IMAGE_CATALOG_JSON:-}
      VM_IMAGE_DEFAULT_ID: ${VM_IMAGE_DEFAULT_ID:-}
      VM_IMAGE_ALLOW_INSECURE_NO_CHECKSUM: ${VM_IMAGE_ALLOW_INSECURE_NO_CHECKSUM:-false}
      CONSOLE_TICKET_TTL_SECONDS: ${CONSOLE_TICKET_TTL_SECONDS:-300}
      CONSOLE_PROXY_HOST: ${CONSOLE_PROXY_HOST:-host.docker.internal}
      CONSOLE_VNC_PORT_BASE: ${CONSOLE_VNC_PORT_BASE:-20000}
      CONSOLE_VNC_PORT_SPAN: ${CONSOLE_VNC_PORT_SPAN:-40000}
    ports:
      - "${MAIN_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  vm-manager:
    build:
      context: ./vm-manager
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cloud}:${RABBITMQ_PASSWORD:-cloud}@localhost:${RABBITMQ_EXPOSE_PORT:-5672}/
      VM_MANAGER_CONCURRENCY: ${VM_MANAGER_CONCURRENCY:-4}
      BASE_IMAGE_URL: ${BASE_IMAGE_URL:-https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img}
      VM_IMAGE_CATALOG_JSON: ${VM_IMAGE_CATALOG_JSON:-}
      VM_IMAGE_DEFAULT_ID: ${VM_IMAGE_DEFAULT_ID:-}
      VM_IMAGE_ALLOW_INSECURE_NO_CHECKSUM: ${VM_IMAGE_ALLOW_INSECURE_NO_CHECKSUM:-false}
      VM_BASE_DIR: ${VM_BASE_DIR:-/var/lib/vm-manager}
      VM_EGRESS_INTERFACE: ${VM_EGRESS_INTERFACE:-}
      VM_COMMAND_TIMEOUT_SECONDS: 120
      VM_NETWORK_CLEANUP_INTERVAL_SECONDS: ${VM_NETWORK_CLEANUP_INTERVAL_SECONDS:-300}
      CONSOLE_VNC_PORT_BASE: ${CONSOLE_VNC_PORT_BASE:-20000}
      CONSOLE_VNC_PORT_SPAN: ${CONSOLE_VNC_PORT_SPAN:-40000}
    volumes:
      - vmdata:${VM_BASE_DIR:-/var/lib/vm-manager}
      - /var/run:/var/run
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      main-api:
        condition: service_healthy

volumes:
  pgdata:
  vmdata:
